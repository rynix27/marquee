name: CI

on:
  push:
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile-check all Python files
        run: python -m py_compile backend/*.py

      - name: Verify required files exist
        run: |
          test -f LICENSE || (echo "Missing LICENSE" && exit 1)
          test -f backend/schema.sql || (echo "Missing schema.sql" && exit 1)
          test -f Dockerfile || (echo "Missing Dockerfile" && exit 1)
          echo "All required files present."

      - name: Install dependencies
        if: ${{ env.CLICKHOUSE_HOST != '' }}
        run: pip install -r requirements.txt
        env:
          CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}

      # Runs the live-ClickHouse test suite only when repo secrets are
      # configured (Settings -> Secrets -> Actions), so CI still passes on
      # forks/PRs that don't have access to those secrets instead of
      # failing every run for contributors without credentials.
      - name: Run alert + seed tests against live ClickHouse
        if: ${{ env.CLICKHOUSE_HOST != '' }}
        run: |
          python -m backend.test_alerts
          python -m backend.test_seed
        env:
          CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
          CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT }}
          CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          CLICKHOUSE_DATABASE: ${{ secrets.CLICKHOUSE_DATABASE }}
